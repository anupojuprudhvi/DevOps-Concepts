apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: caremanagement-app
  namespace: qa
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  rules:
    - http:
        paths:
          - path: /caremanagement             
            backend:
              serviceName: caremanagement
              servicePort: 80
